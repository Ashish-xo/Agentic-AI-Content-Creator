[project]
name = "content-copilot-backend"
version = "0.1.0"
description = "Algorithm-aware AI content copilot — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43",
    "stripe>=11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "torch>=2.5",
    "sentence-transformers>=6.0.1",
    "pgvector>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
